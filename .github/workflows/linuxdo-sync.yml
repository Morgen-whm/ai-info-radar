name: Scheduled production collection

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linuxdo-production-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Fetch protected RSS feeds and sync production
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SITE_URL}" || -z "${SITES_BYPASS_TOKEN}" || -z "${CRON_SECRET}" ]]; then
            echo "Required production secrets are not configured."
            exit 1
          fi

          sync_feed() {
            local source_id="$1"
            local feed_url="$2"
            local feed_file
            local payload_file
            feed_file="$(mktemp)"
            payload_file="$(mktemp)"

            if ! curl \
              --silent \
              --show-error \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 45 \
              --user-agent "TrendHub RSS Collector/1.0" \
              "${feed_url}" \
              --output "${feed_file}"; then
              curl \
                --silent \
                --show-error \
                --fail \
                --location \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 10 \
                --max-time 45 \
                --user-agent "TrendHub RSS Collector/1.0" \
                "https://r.jina.ai/${feed_url}" \
                --output "${feed_file}"
            fi

            if ! grep -Eq "<(rss|feed)([ >])|https://(linux\\.do|idcflare\\.com)/t/" "${feed_file}"; then
              echo "The source returned an invalid public feed document."
              exit 1
            fi

            jq \
              --null-input \
              --arg sourceId "${source_id}" \
              --rawfile feedContent "${feed_file}" \
              '{sourceId: $sourceId, feedContent: $feedContent}' \
              > "${payload_file}"

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "OAI-Sites-Authorization: Bearer ${SITES_BYPASS_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary "@${payload_file}" \
              "${SITE_URL}/api/sync"

            rm -f "${feed_file}" "${payload_file}"
          }

          sync_feed "src-linuxdo-latest" "https://linux.do/latest.rss"
          sync_feed "src-linuxdo-top" "https://linux.do/top.rss?period=daily"
          sync_feed "src-idcflare-daily-top" "https://idcflare.com/top.rss?period=daily"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "OAI-Sites-Authorization: Bearer ${SITES_BYPASS_TOKEN}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/internal/cron"
